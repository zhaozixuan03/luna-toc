<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">LunaTOC Remix</title>
  <desc id="desc">A long conversation turn becomes a concise, evidence-aware Smart Label in a navigable table of contents.</desc>

  <rect width="1200" height="420" rx="28" fill="#282522"/>
  <path d="M720 48V372" stroke="#514b46" stroke-width="1"/>

  <g id="title-block" transform="translate(64 55)">
    <text x="0" y="0" fill="#c86b4a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" letter-spacing="2">LOCAL-FIRST CONVERSATION NAVIGATION</text>
    <text x="0" y="86" fill="#f2ebe3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="66" font-weight="760">LunaTOC</text>
    <text x="0" y="148" fill="#c86b4a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="54" font-weight="680">Remix</text>
    <text x="0" y="210" fill="#d7cec5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="27">Turn long AI chats into an</text>
    <text x="0" y="246" fill="#f2ebe3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="27" font-weight="650">evidence-aware map.</text>

    <g transform="translate(0 292)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="650">
      <rect width="132" height="38" rx="19" fill="#393531" stroke="#665e57"/>
      <text x="66" y="25" fill="#d7cec5" text-anchor="middle">MANIFEST V3</text>
      <rect x="145" width="132" height="38" rx="19" fill="#393531" stroke="#665e57"/>
      <text x="211" y="25" fill="#d7cec5" text-anchor="middle">RAW ↔ SMART</text>
      <rect x="290" width="164" height="38" rx="19" fill="#393531" stroke="#665e57"/>
      <text x="372" y="25" fill="#d7cec5" text-anchor="middle">NO REMOTE MODEL</text>
    </g>
  </g>

  <g id="smart-label-proof" transform="translate(760 52)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="0" y="0" fill="#a99e94" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" letter-spacing="1.5">ONE TURN · TRACEABLE TRANSFORMATION</text>

    <g transform="translate(0 28)">
      <rect width="376" height="76" rx="14" fill="#332f2c" stroke="#5c554f"/>
      <text x="20" y="26" fill="#a99e94" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">RAW TURN 04</text>
      <text x="20" y="56" fill="#f2ebe3" font-size="25" font-weight="650">“do it”</text>
    </g>

    <path d="M188 112V142" stroke="#c86b4a" stroke-width="2"/>
    <path d="M181 135L188 142L195 135" fill="none" stroke="#c86b4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(0 150)">
      <text x="0" y="0" fill="#a99e94" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">BOUNDED LOCAL EVIDENCE</text>
      <rect y="16" width="178" height="38" rx="10" fill="#393531" stroke="#665e57"/>
      <circle cx="20" cy="35" r="5" fill="#81a98e"/>
      <text x="34" y="41" fill="#d7cec5" font-size="18">previous task</text>
      <rect x="190" y="16" width="186" height="38" rx="10" fill="#393531" stroke="#665e57"/>
      <circle cx="210" cy="35" r="5" fill="#81a98e"/>
      <text x="224" y="41" fill="#d7cec5" font-size="18">current reply</text>
    </g>

    <path d="M188 218V248" stroke="#c86b4a" stroke-width="2"/>
    <path d="M181 241L188 248L195 241" fill="none" stroke="#c86b4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(0 256)">
      <rect width="376" height="74" rx="14" fill="#f3e7dc"/>
      <rect width="6" height="74" rx="3" fill="#c86b4a"/>
      <text x="24" y="25" fill="#8e604e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">SMART LABEL · EVIDENCE BOUND</text>
      <text x="24" y="55" fill="#3b302b" font-size="20" font-weight="700">04  Build the release checklist</text>
    </g>

    <g transform="translate(0 350)">
      <circle cx="7" cy="7" r="7" fill="#c86b4a"/>
      <path d="M20 7H222" stroke="#665e57" stroke-width="2"/>
      <circle cx="234" cy="7" r="7" fill="#81a98e"/>
      <text x="376" y="13" fill="#a99e94" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" text-anchor="end">CLICK TO RETURN</text>
    </g>
  </g>
</svg>
